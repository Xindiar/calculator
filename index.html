<!DOCTYPE html>

<head lang="en">
     <title>My-Odin Calculator</title>
    <link rel="stylesheet" href="./styles.css">
    <link href='https://fonts.googleapis.com/css?family=Orbitron' rel='stylesheet' type='text/css'>


</head>


<body >
    <h1>My Calculator</h1>

    <div id="calculator">
        <div id="display-box" style="overflow: hidden;">
        <div><div id="output-box" ></div>
            <div id = "input-box" style="overflow: hidden; width: 390px;"  ></div>
        </div>
        <div style="width: 30px;">
        </div>    
            
        </div>

        <div id="buttons">
            <div class="input-buttons" onclick="buttonClicked('AC')"><span class="front">AC</span ></div>
            <div class="input-buttons" onclick="buttonClicked('1')"><span class="front">1</span ></div>
            <div class="input-buttons" onclick="buttonClicked('4')"><span class="front">4</span ></div>
            <div class="input-buttons" onclick="buttonClicked('7')"><span class="front">7</span ></div>
            <div class="input-buttons" onclick="buttonClicked('.')"><span class="front">.</span ></div>
            <div class="input-buttons" onclick="buttonClicked('bracket')"><span class="front">( )</span ></div>
            <div class="input-buttons" onclick="buttonClicked('2')"><span class="front">2</span ></div>
            <div class="input-buttons" onclick="buttonClicked('5')"><span class="front">5</span ></div>
            <div class="input-buttons" onclick="buttonClicked('8')"><span class="front">8</span ></div>
            <div class="input-buttons" onclick="buttonClicked('0')"><span class="front">0</span ></div>
            <div class="input-buttons" onclick="buttonClicked('-')"><span class="front">-</span ></div>
            <div class="input-buttons" onclick="buttonClicked('3')"><span class="front">3</span ></div>
            <div class="input-buttons" onclick="buttonClicked('6')"><span class="front">6</span ></div>
            <div class="input-buttons" onclick="buttonClicked('9')"><span class="front">9</span ></div>
            <div class="input-buttons" onclick="buttonClicked('⌫')"><span class="front">⌫</span ></div>
            <div class="input-buttons" onclick="buttonClicked('*')"><span class="front">x</span ></div>
            <div class="input-buttons" onclick="buttonClicked('/')"><span class="front">/</span ></div>
            <div class="input-buttons" onclick="buttonClicked('+')"><span class="front">+</span ></div>
            <div class="input-buttons is-equal-to" onclick="buttonClicked('=')" ><span class="front is-equal-to-front">=</span ></div>
        </div>

       


    </div>


 <script src="script.js"></script>
</body>
